# Keep startup positions strictly inside the URDF joint limits.
# When the nominal home pose sits on a hard stop, use a small inward offset
# instead of widening the true joint limits. That avoids tiny floating-point
# drift causing MoveIt's CheckStartStateBounds to reject the start state.
# URDF joint limits, short form:
# - joint1: [-2.618,  2.618] rad (about [-0.833pi,  0.833pi])
# - joint2: [ 0.000,  3.142] rad (about [ 0.000pi,  1.000pi])  fix: home 0.0 is on lower bound, use +offset
# - joint3: [-2.967,  0.000] rad (about [-0.944pi,  0.000pi])  fix: home 0.0 is on upper bound, use -offset
# - joint4: [-1.745,  1.745] rad (about [-0.556pi,  0.556pi])
# - joint5: [-1.222,  1.222] rad (about [-0.389pi,  0.389pi])
# - joint6: [-2.094,  2.094] rad (about [-0.667pi,  0.667pi])
# - gripper_joint1: [ 0.000,  0.050] m  fix: home 0.0 is on lower bound, use +offset
# - gripper_joint2: [-0.050,  0.000] m  mirrored from gripper_joint1 in ros2_control
# Joints 1, 4, 5, and 6 keep 0.0 because that value is already inside range.
initial_positions:
  joint1: 0.0
  joint2: 0.01
  joint3: -0.01
  joint4: 0.0
  joint5: 0.0
  joint6: 0.0
  gripper_joint1: 0.001
